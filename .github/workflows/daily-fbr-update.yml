name: Daily FBR Update

on:
  schedule:
    # 02:00 UTC = 07:00 PKT (Pakistan Standard Time, UTC+5)
    - cron: "0 2 * * *"
  workflow_dispatch:

jobs:
  daily-update:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run daily update
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: python scripts/daily_update.py

      - name: Upload run report and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-update-artifacts
          path: |
            data/profile/daily_update/last_run_report.json
            data/profile/daily_update/daily_update.log
          retention-days: 7
          if-no-files-found: warn
