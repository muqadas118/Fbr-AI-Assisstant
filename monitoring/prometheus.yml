# Prometheus scrape config for the FBR AI Assistant.
# Referenced by docker-compose.yml (prometheus service). Without this file
# `docker compose up` fails on a missing bind mount.
#
# The /metrics endpoint is mounted in Phase B (app/deployment/metrics.py).
# Until then this target will show as DOWN, which is the honest state.

global:
  scrape_interval: 30s
  evaluation_interval: 30s
  external_labels:
    project: fbr-ai-assistant

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: fbr-api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8000"]
