version: "3.9"

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fbr-api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Secrets come from .env only — never inline them here.
      # Required in .env: SUPABASE_URL, SUPABASE_ANON_KEY, SUPABASE_JWT_SECRET
      - FBR_AUTH_REQUIRED=${FBR_AUTH_REQUIRED:-true}
    ports:
      - "8000:8000"
    volumes:
      - ./uploads:/app/uploads
      - ./data:/app/data
    depends_on:
      - postgres
      - redis
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - fbr-net

  postgres:
    image: postgres:16-alpine
    container_name: fbr-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-fbr_assistant}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - fbr-net

  redis:
    image: redis:7-alpine
    container_name: fbr-redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    networks:
      - fbr-net

  prometheus:
    image: prom/prometheus:latest
    container_name: fbr-prometheus
    restart: unless-stopped
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    networks:
      - fbr-net

  grafana:
    image: grafana/grafana:latest
    container_name: fbr-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD in .env}
    volumes:
      - grafana_data:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    networks:
      - fbr-net

volumes:
  postgres_data:
  redis_data:
  grafana_data:

networks:
  fbr-net:
    driver: bridge
